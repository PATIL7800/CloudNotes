{% extends "base.html" %}

{% block title %}Login | CloudNotes{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Welcome Back!</h1>
    <p class="subtitle">Login to access your CloudNotes.</p>

    <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required
            autocomplete="current-password">

        <p id="auth-error" class="message error" role="alert"></p>

        <button type="submit">Login</button>
    </form>

    <p class="auth-link">
        New here? <a href="/register">Create an account</a>
    </p>
</div>

<script type="module" src="{{ url_for('static', filename='js/firebase-auth.js') }}">
</script>
{% endblock %}
