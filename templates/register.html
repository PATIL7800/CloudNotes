{% extends "base.html" %}

{% block title %}Register | CloudNotes{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Create your CloudNotes account to get started.</p>

    <form id="register-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required autocomplete="email">

        <label for="password">Create password</label>
        <input id="password" name="password" type="password" placeholder="At least 6 characters" required minlength="6"
            autocomplete="new-password">

        <p id="auth-error" class="message error" role="alert"></p>

        <button type="submit">Create Account</button>
    </form>

    <p class="auth-link">
        Already registered? <a href="/">Login here</a>
    </p>
</div>

<script type="module" src="{{ url_for('static', filename='js/firebase-auth.js') }}">
</script>
{% endblock %}
